# Pulls the latest numbers from Majestic's spreadsheet and opens a pull request.
# Nothing is published until an editor reviews and merges it.
name: Import from spreadsheet

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Import
        env:
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
        run: |
          node scripts/import-sheet.mjs --range "Weapons!A1:AC1185" --range "Pieces!A1:AK1027" --range "Items!A1:AK1005" --range "Armory!A1:AB1294" --range "Monstrum!A1:AK990" --range "M.Food!A1:AE996" --range "Mon.Weakness!A1:AB1011" --range "Wizardry!A1:AC1176" --range "W.Creatures!A1:AK923" --range "W.Food!A1:AA1007" --range "'Weapons-F&I'!A1:AO1165" --range "'Armor-F&I'!A1:AK986" --range "M.DeepNorth!A1:AK1075" --range "DN-Progression!A1:Y987" | tee import-report.txt
      - name: Check that the site still builds
        run: npx astro build
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: import/spreadsheet
          title: 'Import from spreadsheet'
          commit-message: 'Import latest values from the spreadsheet'
          body-path: import-report.txt
          add-paths: |
            src/data/items
            src/data/tables
          labels: import
